<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eunjoo Kim - 방명록</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div class="guestbook-container">
            <header class="guestbook-header">
                <h1>커뮤니티 보드</h1>
                <a href="index.html" class="back-link">&larr; 프로필로 돌아가기</a>
            </header>

            <main class="guestbook-content">
                <section class="guestbook-form-section" style="max-width: 400px;">
                    <h3 style="margin-bottom: 1.5rem; color: var(--color-primary);">새 글 작성</h3>
                    <input type="text" id="gbTitle" class="gb-input" placeholder="글 제목을 입력하세요" required>
                    <input type="text" id="gbName" class="gb-input" placeholder="작성자 성함" required>
                    <input type="password" id="gbPw" class="gb-input" placeholder="삭제 비밀번호 (4자리 이상)" required>
                    <textarea id="gbText" class="gb-textarea" style="height: 200px;" placeholder="내용을 작성해주세요..." required></textarea>
                    <button type="button" id="gbSubmitBtn" class="gb-submit">게시물 등록</button>
                </section>

                <section class="guestbook-right-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="color: var(--color-primary);">전체 게시글</h3>
                    </div>
                    <div class="guestbook-list-section" id="gbMessageList">
                        <!-- Board posts will render here -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://uinxxjfydegnknpyxbxg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yWvOagW3pSYy5S4VW0_Z4Q_aH88rT9Q';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const btn = document.getElementById('gbSubmitBtn');
        const titleInput = document.getElementById('gbTitle');
        const nameInput = document.getElementById('gbName');
        const pwInput = document.getElementById('gbPw');
        const textInput = document.getElementById('gbText');
        const messageList = document.getElementById('gbMessageList');

        // 게시글 목록 불러오기
        async function loadMessages() {
            const { data: posts, error } = await _supabase
                .from('guestbook')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                messageList.innerHTML = `<p style="color:red; text-align:center;">오류: 테이블을 먼저 생성해 주세요!</p>`;
                return;
            }

            messageList.innerHTML = '';
            
            if (!posts || posts.length === 0) {
                messageList.innerHTML = '<p style="color:#9ca3af;text-align:center;margin-top:3rem;">등록된 게시글이 없습니다.</p>';
                return;
            }

            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'gb-message';
                
                const d = new Date(post.created_at);
                const dateString = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;

                div.innerHTML = `
                    <div class="gb-message-header">
                        <div style="display:flex; flex-direction:column;">
                             <span style="font-size: 1.2rem; font-weight: 700; color: var(--color-primary);">${escapeHTML(post.title)}</span>
                             <span style="font-size: 0.85rem; color: #6b7280;">작성자: ${escapeHTML(post.name)}</span>
                        </div>
                        <div style="text-align: right;">
                             <button onclick="deletePost(${post.id}, '${post.password}')" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.8rem;">삭제</button>
                             <div class="gb-date">${dateString}</div>
                        </div>
                    </div>
                    <div class="gb-text" style="margin-top: 1rem; border-top: 1px solid #f3f4f6; padding-top: 1rem;">${escapeHTML(post.content)}</div>
                `;
                messageList.appendChild(div);
            });
        }

        // 게시글 삭제 (비밀번호 확인)
        window.deletePost = async function(id, correctPw) {
            const inputPw = prompt('게시글 작성을 위해 설정한 비밀번호를 입력하세요:');
            if (inputPw === null) return;
            
            if (inputPw !== correctPw) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }

            if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
                const { error } = await _supabase.from('guestbook').delete().eq('id', id);
                if (error) alert('삭제 실패: ' + error.message);
                else loadMessages();
            }
        };

        // 게시글 등록
        btn.addEventListener('click', async () => {
            const title = titleInput.value.trim();
            const name = nameInput.value.trim();
            const pw = pwInput.value.trim();
            const content = textInput.value.trim();

            if (!title || !name || !pw || !content) {
                alert('모든 필드를 입력해 주세요.');
                return;
            }

            if (pw.length < 4) {
                alert('비밀번호는 4자리 이상으로 설정해 주세요.');
                return;
            }

            btn.disabled = true;
            btn.textContent = '게시 중...';

            const { error } = await _supabase.from('guestbook').insert([{ 
                title, name, password: pw, content 
            }]);

            if (error) {
                alert('저장 실패: ' + error.message);
            } else {
                titleInput.value = '';
                nameInput.value = '';
                pwInput.value = '';
                textInput.value = '';
                await loadMessages();
            }
            btn.disabled = false;
            btn.textContent = '게시물 등록';
        });

        function escapeHTML(str) {
            if(!str) return '';
            return str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t));
        }

        loadMessages();
    </script>


</body>
</html>
