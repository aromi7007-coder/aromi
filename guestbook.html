<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eunjoo Kim - 방명록</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div class="guestbook-container">
            <header class="guestbook-header">
                <h1>방명록</h1>
                <a href="index.html" class="back-link">&larr; 프로필로 돌아가기</a>
            </header>

            <main class="guestbook-content">
                <section class="guestbook-form-section">
                    <input type="text" id="gbName" class="gb-input" placeholder="이름을 남겨주세요" required>
                    <textarea id="gbText" class="gb-textarea" placeholder="자유롭게 방명록 메시지를 작성해주세요..." required></textarea>
                    <button type="button" id="gbSubmitBtn" class="gb-submit">메시지 남기기</button>
                </section>

                <section class="guestbook-right-section">
                    <!-- Calendar Widget -->
                    <div class="calendar-widget" id="calendarWidget" style="margin-top: 0; margin-bottom: 2rem; max-width: 100%;">
                        <div class="calendar-header">
                            <button type="button" id="prevMonth">&lt;</button>
                            <span id="monthYear"></span>
                            <button type="button" id="nextMonth">&gt;</button>
                        </div>
                        <div class="calendar-body">
                            <div class="days-row">
                                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                            </div>
                            <div class="dates-grid" id="datesGrid"></div>
                        </div>
                    </div>

                    <div class="guestbook-list-section" id="gbMessageList" style="flex: 1; overflow-y: auto; padding-right: 1rem;">
                        <!-- Messages will be rendered here by JS -->
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const btn = document.getElementById('gbSubmitBtn');
        const nameInput = document.getElementById('gbName');
        const textInput = document.getElementById('gbText');
        const messageList = document.getElementById('gbMessageList');

        const STORAGE_KEY = 'resume_guestbook_data';

        function loadMessages() {
            const msgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            messageList.innerHTML = '';
            
            if (msgs.length === 0) {
                messageList.innerHTML = '<p style="color:#9ca3af;text-align:center;margin-top:3rem;">아직 등록된 방명록이 없습니다.<br>첫 번째 메시지를 남겨보세요!</p>';
                return;
            }

            msgs.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'gb-message';
                
                // Formatted date string
                const d = new Date(msg.date);
                const dateString = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

                div.innerHTML = `
                    <div class="gb-message-header">
                        <span class="gb-author">${escapeHTML(msg.name)}</span>
                        <span class="gb-date">${dateString}</span>
                    </div>
                    <div class="gb-text">${escapeHTML(msg.text)}</div>
                `;
                messageList.appendChild(div);
            });
        }

        // Basic XSS protection for display
        function escapeHTML(str) {
            if(!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        btn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (!name || !text) {
                alert('이름과 메시지를 모두 입력해주세요.');
                return;
            }

            const msgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            msgs.unshift({
                name,
                text,
                date: new Date().toISOString()
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
            nameInput.value = '';
            textInput.value = '';
            loadMessages();
        });

        // Initialize display
        loadMessages();

        // Calendar Logic
        const monthYearText = document.getElementById('monthYear');
        const datesGrid = document.getElementById('datesGrid');
        let currentDate = new Date();

        function renderCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            const today = new Date();

            monthYearText.textContent = `${year}년 ${month + 1}월`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            datesGrid.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                const emptySpan = document.createElement('span');
                emptySpan.className = 'empty';
                datesGrid.appendChild(emptySpan);
            }

            for (let i = 1; i <= lastDate; i++) {
                const daySpan = document.createElement('span');
                daySpan.textContent = i;
                if (year === today.getFullYear() && month === today.getMonth() && i === today.getDate()) {
                    daySpan.classList.add('today');
                }
                datesGrid.appendChild(daySpan);
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        });

        renderCalendar(currentDate);
    </script>
</body>
</html>
