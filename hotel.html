<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호텔 소개 - Hotel Tour</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Include Playfair Display for the serif italic font from the image -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div class="hotel-split-container">
            <!-- Left Side: Text Content similar to the reference image -->
            <div class="hotel-left-panel">
                <div class="hotel-text-content">
                    <h1 class="hotel-title">Hotel Tour<br>Since 2026</h1>
                    <p class="hotel-subtitle">세상에 하나 뿐인 프리미엄 호텔 투어</p>
                    <div style="margin-top: 2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                        <a href="index.html" class="guestbook-btn" style="padding: 0.8rem 1.5rem; font-size: 0.9rem; background-color: #ffffff; color: var(--color-primary); border: 1px solid var(--color-primary);">← 뒤로가기</a>
                        <a href="https://youtu.be/f1i8Yu0ima8?si=FA2ZZKNk-lOzBiwd" target="_blank" class="guestbook-btn" style="padding: 0.8rem 1.5rem; font-size: 0.9rem;">호텔소개</a>
                    </div>
                </div>
            </div>

            <!-- Right Side: Full Bleed Image -->
            <div class="hotel-right-panel">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2070&auto=format&fit=crop" alt="Beautiful Luxury Hotel Exterior" class="hotel-hero-image">
            </div>
        </div>
    </div>
</body>
</html>
